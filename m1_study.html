<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M1 Maths Study Dashboard</title>
<meta name="description" content="Interactive study dashboard for Mathematics-1 (Mathematics for Problem-Solving): all 11 Lecture Sheets, 11 Lab Sheets, 4 Problem Solving Modules, interactive solvers, flashcards, quiz, exam mode, and Formula Match.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#08090C;--surface:#111318;--surface2:#1A1D25;--ink:#EAECEF;--muted:#9BA1B0;--line:#2A2E39;
  --acc:#D4AF37;--acc-ink:#08090C;--acc-soft:#262010;
  --p1:#E6C15A;--p1s:#251F0E;--p2:#C8CDD8;--p2s:#222630;--p3:#D99B52;--p3s:#261C11;--p4:#9BA4B5;--p4s:#1B1F28;--p5:#F0D68A;--p5s:#262112;
  --ok:#C5A028;--oks:#211D0E;--bad:#D96B6B;--bads:#2E1616;--warn:#E6C15A;--warns:#28210E;
  --code-bg:#050608;--code-ink:#E6E8EE;--code-dim:#7C8291;--code-prompt:#E6C15A;
  --pop:0 10px 30px rgba(0,0,0,.65);
  --fh:"Bricolage Grotesque","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --fb:"Figtree","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --fm:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#ECEEF2;--surface:#F9FAFB;--surface2:#E2E5EC;--ink:#12141A;--muted:#5A6070;--line:#CFD4DF;
  --acc:#A87D10;--acc-ink:#FFFFFF;--acc-soft:#F7EFD7;
  --p1:#9E760D;--p1s:#F5ECD2;--p2:#4A5162;--p2s:#E3E6EE;--p3:#8C5820;--p3s:#F4E7D8;--p4:#5E6575;--p4s:#E6E9F0;--p5:#B38714;--p5s:#F7EFD7;
  --ok:#8A6B12;--oks:#F4EDD5;--bad:#B53838;--bads:#F8E1E1;--warn:#8A6208;--warns:#F7ECCD;
  --code-bg:#12141A;--code-ink:#E6E8EE;--code-dim:#8C93A3;--code-prompt:#E6C15A;
  --pop:0 10px 30px rgba(15,20,30,.14);color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#08090C;--surface:#111318;--surface2:#1A1D25;--ink:#EAECEF;--muted:#9BA1B0;--line:#2A2E39;
  --acc:#D4AF37;--acc-ink:#08090C;--acc-soft:#262010;
  --p1:#E6C15A;--p1s:#251F0E;--p2:#C8CDD8;--p2s:#222630;--p3:#D99B52;--p3s:#261C11;--p4:#9BA4B5;--p4s:#1B1F28;--p5:#F0D68A;--p5s:#262112;
  --ok:#C5A028;--oks:#211D0E;--bad:#D96B6B;--bads:#2E1616;--warn:#E6C15A;--warns:#28210E;
  --code-bg:#050608;--code-ink:#E6E8EE;--code-dim:#7C8291;--code-prompt:#E6C15A;
  --pop:0 10px 30px rgba(0,0,0,.65);color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.6;min-height:100%}
h1,h2,h3,h4{font-family:var(--fh);line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,4vw,2.7rem);font-weight:800}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.12rem;font-weight:700}
h4{font-size:1rem;font-weight:700}
p{margin:0 0 .8em}
a{color:var(--acc)}
code{font-family:var(--fm);font-size:.88em;background:var(--surface2);padding:.1em .38em;border-radius:5px;border:1px solid var(--line)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:.5em .7em;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
mark{background:var(--warns);color:var(--ink);border-radius:3px;padding:0 2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* layout */
.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100dvh}
.sidebar{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px 28px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:4px 6px 14px}
.brand-mark{font-family:var(--fm);font-weight:700;background:var(--code-bg);color:var(--code-prompt);border-radius:9px;padding:6px 9px;font-size:.9rem}
.brand b{font-family:var(--fh);font-size:1.15rem}
.brand small{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:.94rem}
.nav a:hover{background:var(--surface2)}
.nav a.on{background:var(--acc-soft);font-weight:700}
.nav details{margin:2px 0}
.nav summary{cursor:pointer;list-style:none;padding:8px 10px;font-weight:700;font-family:var(--fh);border-radius:9px;display:flex;justify-content:space-between;align-items:center}
.nav summary::-webkit-details-marker{display:none}
.nav summary::after{content:"+";color:var(--muted);font-weight:500}
.nav details[open]>summary::after{content:"–"}
.nav summary:hover{background:var(--surface2)}
.nav .grp{margin:14px 10px 4px;color:var(--muted);font-size:.82rem;font-weight:600}
.mnum{flex:0 0 auto;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:.76rem;font-weight:700;font-family:var(--fm)}
.p1 .mnum,.mnum.p1{background:var(--p1s);color:var(--p1)}
.p2 .mnum,.mnum.p2{background:var(--p2s);color:var(--p2)}
.p3 .mnum,.mnum.p3{background:var(--p3s);color:var(--p3)}
.p4 .mnum,.mnum.p4{background:var(--p4s);color:var(--p4)}
.p5 .mnum,.mnum.p5{background:var(--p5s);color:var(--p5)}
.nav a.done .mnum{background:var(--ok);color:var(--surface)}
.nav a.done .mnum::before{content:"✓"}
.nav a.done .mnum span{display:none}
.mt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{min-width:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:10px;align-items:center;padding:10px clamp(12px,3vw,32px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.search{flex:1;position:relative;max-width:640px}
.search input{width:100%;padding:.62em .9em .62em 2.3em;border-radius:12px}
.search svg{position:absolute;left:.75em;top:50%;transform:translateY(-50%);color:var(--muted)}
.search kbd{position:absolute;right:.6em;top:50%;transform:translateY(-50%);font-family:var(--fm);font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 .4em;background:var(--surface2)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;flex:0 0 auto}
.icon-btn:hover{background:var(--surface2)}
#menuBtn{display:none}
.view{max-width:1120px;margin:0 auto;padding:clamp(16px,3vw,34px) clamp(12px,3vw,32px) 80px}
.overlay{display:none}
@media (max-width:920px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;z-index:40;top:0;bottom:0;left:0;width:min(86vw,320px);height:auto;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--pop)}
  .sidebar.open{transform:none}
  .overlay.show{display:block;position:fixed;inset:0;z-index:30;background:rgba(5,10,25,.5)}
  #menuBtn{display:grid}
  .search kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* generic components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.card.flat{background:var(--surface2);border-color:transparent}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.btn{display:inline-flex;align-items:center;gap:.4em;padding:.55em 1em;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none;color:var(--ink);line-height:1.2}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:.35em .7em;font-size:.88rem;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.3em .85em;font-size:.9rem;text-decoration:none;color:var(--ink);cursor:pointer}
.chip:hover{background:var(--surface2)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.badge{display:inline-block;border-radius:7px;padding:.05em .55em;font-size:.8rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.badge.p1{background:var(--p1s);color:var(--p1)}.badge.p2{background:var(--p2s);color:var(--p2)}.badge.p3{background:var(--p3s);color:var(--p3)}.badge.p4{background:var(--p4s);color:var(--p4)}
.badge.p5{background:var(--p5s);color:var(--p5)}
.badge.ok{background:var(--oks);color:var(--ok)}.badge.bad{background:var(--bads);color:var(--bad)}.badge.warn{background:var(--warns);color:var(--warn)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{border:0;background:none;padding:.6em 1em;border-radius:10px 10px 0 0;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--acc)}
.progress{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
.progress.p1>i{background:var(--p1)}.progress.p2>i{background:var(--p2)}.progress.p3>i{background:var(--p3)}.progress.p4>i{background:var(--p4)}
.progress.p5>i{background:var(--p5)}
.np{border:1.5px dashed var(--warn);background:var(--warns);color:var(--ink);border-radius:12px;padding:12px 14px;margin:10px 0}
.np b{color:var(--warn)}
.tag-extra{display:inline-block;font-size:.72rem;font-weight:700;background:var(--warns);color:var(--warn);border-radius:6px;padding:0 .45em;margin-left:.4em;vertical-align:middle}
.tag-calc{display:inline-block;font-size:.72rem;font-weight:700;background:var(--acc-soft);color:var(--acc);border-radius:6px;padding:0 .45em;margin-left:.4em;vertical-align:middle}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:.94rem}
th,td{padding:.6em .8em;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface2);font-family:var(--fh);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.table-wrap table td:first-child{font-weight:600}
ul.clean{margin:0;padding:0;list-style:none}
ul.clean li{position:relative;padding:.35em 0 .35em 1.7em;border-bottom:1px dashed var(--line)}
ul.clean li:last-child{border-bottom:0}
ul.clean li::before{content:"";position:absolute;left:.25em;top:.95em;width:.6em;height:.6em;border-radius:3px;background:var(--acc)}
ul.trap li::before{background:var(--bad);border-radius:50%}
ul.trick li::before{background:var(--p3);transform:rotate(45deg)}
ul.exam li::before{background:var(--ok)}
ul.rev li::before{background:var(--p2)}
.code{background:var(--code-bg);color:var(--code-ink);border-radius:10px;margin:8px 0;overflow:hidden;border:1px solid color-mix(in srgb,var(--code-bg) 70%,#fff 8%)}
.code-h{font-family:var(--fm);font-size:.75rem;color:var(--code-dim);padding:6px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.code pre{margin:0;padding:12px 14px;overflow-x:auto;font-family:var(--fm);font-size:.86rem;line-height:1.55}
.code code{background:none;border:0;padding:0;font-size:inherit}
.code .pr{color:var(--code-prompt)}.code .cm{color:var(--code-dim)}
.kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:6px 14px}
.kv dt{font-weight:700}.kv dd{margin:0}
@media (max-width:620px){.kv{grid-template-columns:1fr}.kv dd{margin-bottom:8px}}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
details.sec>summary{cursor:pointer;list-style:none;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h3{margin:0}
details.sec>summary::after{content:"+";font-size:1.3rem;color:var(--muted);font-family:var(--fm)}
details.sec[open]>summary::after{content:"–"}
details.sec>.sec-b{padding:2px 18px 16px}
.page-h{margin-bottom:22px}
.page-h p{max-width:70ch;color:var(--muted);font-size:1.05rem}
.stat{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-family:var(--fh);font-size:1.9rem;line-height:1.1}
.stat span{color:var(--muted);font-size:.9rem}

/* hero + module map */
.hero{background:var(--code-bg);color:var(--code-ink);border-radius:18px;padding:clamp(18px,3vw,30px);margin-bottom:18px;border:1px solid color-mix(in srgb,var(--code-bg) 70%,#fff 8%)}
.hero .ln{font-family:var(--fm);font-size:.95rem;color:var(--code-dim);min-height:1.5em}
.hero .ln .pr{color:var(--code-prompt)}.hero .ln .cmd{color:var(--code-ink)}
.hero .cur{display:inline-block;width:.6em;height:1.05em;background:var(--code-prompt);vertical-align:-.18em;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.hero h1{color:#fff;margin:.35em 0 .3em}
.hero p{color:#B4C0D8;max-width:62ch}
.hero .chip{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18);color:#E6EBF6}
.hero .chip:hover{background:rgba(255,255,255,.16)}
.map-part{margin-bottom:16px}
.map-part h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,196px),1fr));gap:10px}
.tile{position:relative;display:block;text-decoration:none;color:var(--ink);border-radius:12px;padding:11px 12px;border:1px solid var(--line);background:var(--surface);min-height:74px}
.tile:hover{border-color:var(--ink)}
.tile .mnum{margin-bottom:6px;width:auto;padding:0 8px;height:22px}
.tile.p1 .mnum{background:var(--p1s);color:var(--p1)}.tile.p2 .mnum{background:var(--p2s);color:var(--p2)}.tile.p3 .mnum{background:var(--p3s);color:var(--p3)}.tile.p4 .mnum{background:var(--p4s);color:var(--p4)}
.tile.p5 .mnum{background:var(--p5s);color:var(--p5)}
.tile b{display:block;font-family:var(--fh);font-size:.95rem;line-height:1.25}
.tile.done{background:var(--oks);border-color:var(--ok)}
.tile.done .mnum{background:var(--ok);color:var(--surface)}
.tile.done .mnum::after{content:" ✓"}

/* module page */
.mod-h{border-radius:16px;padding:20px 22px;margin-bottom:16px;border:1px solid var(--line)}
.mod-h.p1{background:var(--p1s)}.mod-h.p2{background:var(--p2s)}.mod-h.p3{background:var(--p3s)}.mod-h.p4{background:var(--p4s)}
.mod-h.p5{background:var(--p5s)}
.mod-h h1{margin:.2em 0 .3em}
.think{border-left:4px solid var(--acc);padding:6px 0 6px 14px;margin:12px 0;color:var(--muted)}
.think b{color:var(--ink)}
.ex-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;background:var(--bg)}
.ex-card h4{margin-bottom:.25em}
.term-key{font-size:.7rem;font-weight:700;background:var(--acc-soft);color:var(--acc);border-radius:6px;padding:0 .4em;margin-left:.4em;vertical-align:middle}
.mod-nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}

/* lab & problem solving extras */
.prob-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--bg)}
.prob-item b{color:var(--ink)}
.ps-box{border:1.5px solid var(--p2);background:color-mix(in srgb,var(--p2s) 45%,var(--surface));border-radius:14px;padding:16px 18px;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
.field input,.field select{color:var(--ink)}
.err{color:var(--bad);font-weight:600}

/* flashcards + quiz */
.flip{perspective:1200px;max-width:720px;margin:0 auto}
.flip-in{position:relative;min-height:260px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flip.f .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:26px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--line);background:var(--surface);overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--acc-soft)}
.face .q{font-family:var(--fh);font-size:1.35rem;font-weight:700}
.face .hint{color:var(--muted);font-size:.85rem;margin-top:12px}
@media (prefers-reduced-motion:reduce){.flip-in{transition:none}.face{backface-visibility:visible}.flip.f .face.front{display:none}.face.back{transform:none;position:absolute}.flip:not(.f) .face.back{display:none}}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;margin:8px 0}
.opt:hover{border-color:var(--ink)}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt.right{border-color:var(--ok);background:var(--oks)}
.opt.wrong{border-color:var(--bad);background:var(--bads)}
.opt .k{flex:0 0 auto;font-family:var(--fm);font-weight:700;width:1.6em;height:1.6em;border-radius:6px;background:var(--surface2);display:grid;place-items:center;font-size:.85rem}
.qbox{max-width:800px}
.fb{border-radius:12px;padding:14px 16px;margin-top:12px;border:1.5px solid}
.fb.ok{background:var(--oks);border-color:var(--ok)}.fb.bad{background:var(--bads);border-color:var(--bad)}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.pal{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--fm);font-size:.82rem}
.pal.ans{background:var(--acc-soft);border-color:var(--acc)}
.pal.cur{outline:3px solid var(--acc);outline-offset:1px}
.pal.ok{background:var(--oks);border-color:var(--ok)}.pal.no{background:var(--bads);border-color:var(--bad)}
.q-text{font-size:1.15rem;font-weight:600;margin:.4em 0 .6em}
.bars .b{display:grid;grid-template-columns:160px 1fr 52px;gap:10px;align-items:center;margin:6px 0;font-size:.92rem}
@media (max-width:620px){.bars .b{grid-template-columns:100px 1fr 44px}}
.res{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;background:var(--surface)}
.res .ttl{font-weight:700}
.res .snip{color:var(--muted);font-size:.92rem}
.hide{display:none!important}
.cmd-card{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:10px}
.cmd-card>summary{cursor:pointer;list-style:none;padding:10px 14px;display:flex;gap:12px;align-items:center}
.cmd-card>summary::-webkit-details-marker{display:none}
.cmd-card>summary code{font-size:1rem;font-weight:700;background:var(--code-bg);color:var(--code-prompt);border-color:transparent;padding:.2em .6em}
.cmd-card .cmd-b{padding:4px 16px 14px}
.cmd-card[open]>summary{border-bottom:1px solid var(--line)}
.sym{font-family:var(--fm);font-size:1.4rem;font-weight:700;background:var(--code-bg);color:var(--code-prompt);border-radius:10px;min-width:64px;text-align:center;padding:6px 10px;align-self:flex-start}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:10px;padding:.6em 1.1em;z-index:60;box-shadow:var(--pop)}

/* ===== gamification ===== */
.confetti-host{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.confetti-piece{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;opacity:.95;animation-name:confetti-fall;animation-timing-function:cubic-bezier(.25,.46,.45,.94);animation-fill-mode:forwards;transform:rotate(0)}
@keyframes confetti-fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--drift),108vh) rotate(var(--rot))}}
@media (prefers-reduced-motion:reduce){.confetti-piece{display:none}}
.xpw{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 10px;height:40px;flex:0 0 auto;font-weight:700;font-size:.82rem;color:var(--ink);text-decoration:none}
.xpw:hover{background:var(--surface2)}
.xpw-lvl{font-family:var(--fh);white-space:nowrap}
.xpw-bar{width:54px;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;display:inline-block}
.xpw-bar>i{display:block;height:100%;background:linear-gradient(90deg,#B88E1E,#E6C15A,#D4D7DF);border-radius:99px}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px}
.badge-card{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);text-align:center;opacity:.4;filter:grayscale(1)}
.badge-card.on{opacity:1;filter:none;border-color:var(--acc);background:var(--acc-soft)}
.badge-card .bi{font-size:2rem;line-height:1}
.badge-card b{display:block;font-family:var(--fh);margin:4px 0 2px;font-size:.92rem}
.badge-card span{font-size:.78rem;color:var(--muted)}
.streak-pill{display:inline-flex;align-items:center;gap:5px;background:var(--warns);color:var(--warn);border-radius:999px;padding:.25em .8em;font-weight:700;font-size:.9rem}

/* ===== match game ===== */
.game-head{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:14px}
.game-stats{display:flex;gap:16px;font-family:var(--fm)}
.game-stats b{display:block;font-family:var(--fh);font-size:1.3rem}
.match-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.mcard{aspect-ratio:1/1;border-radius:12px;cursor:pointer;perspective:800px}
.mcard-in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mcard.flip .mcard-in{transform:rotateY(180deg)}
.mface{position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;backface-visibility:hidden;border:1.5px solid var(--line);font-size:.82rem;font-weight:600;overflow:hidden}
.mface.back{background:var(--code-bg);color:var(--code-prompt);font-family:var(--fm);font-size:1.4rem}
.mface.front{background:var(--surface);transform:rotateY(180deg);line-height:1.25}
.mcard.matched .mface.front{background:var(--oks);border-color:var(--ok);color:var(--ok)}
.mcard.cmdtype .mface.front{font-family:var(--fm);font-weight:700;font-size:.92rem}
.game-win{text-align:center;padding:30px 16px}
.game-win .big-emoji{font-size:3rem;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){.mcard-in{transition:none}}

{ n: 5, part: 2, title: "Divisibility, GCD/HCF, LCM & Euclidean Algorithm", slides: "M1_Lecture_Sheet_05.pdf · 13 pages",
  simple: "Divisibility (`d | n`) means `n = dk` with zero remainder. Primes are the building blocks of natural numbers, and the Fundamental Theorem of Arithmetic guarantees unique prime factorisation. From prime blocks, GCD takes the **MIN** powers and LCM takes the **MAX** powers — and for huge numbers, Euclid's Algorithm finds GCD in a few fast division steps without factoring.",

  concepts: [
    "**Divisibility:** `d | n` means `n = dk` for some integer `k` (remainder `0`). `6 | 24` is true; `6 ∤ 25`.",
    "**Prime vs. Composite:** A prime has **exactly two** positive divisors (`1` and itself). A composite has more than two. (`1` is neither.)",
    "**Fundamental Theorem of Arithmetic:** Every natural number `> 1` is prime or a unique product of primes (up to order). The *Even-Verse* (`2, 4, 6, ...`) shows uniqueness fails in some systems (`36 = 18×2 = 6×6`), so uniqueness is special!",
    "**Prime Factorisation for GCD & LCM:** Write both numbers in primes. **GCD → MIN powers** (what both can supply). **LCM → MAX powers** (enough for either).",
    "**Fundamental Identity:** `gcd(a, b) × lcm(a, b) = a × b` (because `min(r, s) + max(r, s) = r + s` for every prime!). Note: knowing `gcd` and `lcm` gives `ab`, not necessarily a unique pair `{a, b}`.",
    "**Coprime (Relatively Prime):** `gcd(a, b) = 1`. Thread art with `N` pegs and gap `g` visits every peg iff `gcd(N, g) = 1`.",
    "**Division Algorithm:** For integer `a` and `b > 0`, `a = bq + r` with `0 ≤ r < b` (unique remainder).",
    "**Euclidean Algorithm:** Repeatedly replace `(a, b) → (b, r)` using `gcd(a, b) = gcd(b, r)` until remainder is `0`. The **last non-zero remainder** is the GCD!"
  ],
  terms: [

    ["Fundamental Theorem of Arithmetic", "Every integer > 1 has a unique prime factorisation (up to order).", 1],

{ n: 6, part: 2, title: "Congruence and Modular Arithmetic", slides: "M1_Lecture_Sheet_06.pdf · 15 pages",
  simple: "Modular arithmetic is the mathematics of cycles. On a 5-position track `0, 1, 2, 3, 4`, moving 17 steps lands at `2` (the standard remainder). Two numbers are **congruent modulo n** (`a ≡ b (mod n)`) if they leave the same remainder when divided by `n` — equivalently, `n | (a - b)`. You can reduce huge numbers *before* adding, subtracting, multiplying, or raising to powers!",
  analogy: "A circular clock with `n` positions `0, 1, ..., n-1`. Walking 17 steps forward lands at the same spot (`2`) as walking `3` steps backward from `20` (`-3`).",
  concepts: [
    "**Modulo `n`:** Remainders after division by `n`, i.e. positions `0, 1, 2, ..., n-1` on a cycle.",
    "**Standard Remainder vs. Negative Representative:** `17 = 5(3) + 2` (standard remainder `2`, `0 ≤ r < 5`) and `17 = 5(4) - 3` (negative representative `-3`). Both land at position `2` mod `5`.",
    "**Congruence Definition:** `a ≡ b (mod n)` iff `a` and `b` leave the same remainder mod `n`, iff **`n | (a - b)`**, iff `a = b + kn` for some integer `k`.",
    "**Congruence Properties:** If `a ≡ b (mod n)` and `c ≡ d (mod n)`, then: `a + c ≡ b + d`, `a - c ≡ b - d`, `ac ≡ bd`, `ka ≡ kb`, and `a^k ≡ b^k (mod n)` for positive integer `k`.",
    "**Reduce First, Then Calculate:** Replace large numbers with small representatives (e.g. `46¹⁰⁰ ≡ 1¹⁰⁰ ≡ 1 (mod 5)`).",
    "**Cancellation Caution!** `2 · 1 ≡ 2 · 4 (mod 6)` is true (`2 ≡ 8 (mod 6)`), **but** `1 ≢ 4 (mod 6)`! You **cannot** always cancel a common factor `k` in congruences unless `gcd(k, n) = 1`.",
    "**Applications:** Cryptography (RSA, blockchain), computer integer overflow (`mod 2^n`), error detection (QR codes, Luhn checksum), and hashing."
  ],
  terms: [
    ["Modulo n", "Working on a cycle of remainders 0, 1, ..., n - 1.", 1],
    ["Standard Remainder", "The unique remainder r with 0 ≤ r < n.", 1],
    ["a ≡ b (mod n)", "a and b leave the same remainder mod n; equivalently n | (a - b).", 1],
    ["Remainder Family", "All integers {a + kn : k ∈ ℤ} that land at position a mod n.", 0]
  ],
  examples: [
    { t: "Negative Numbers Modulo 7", b: "`-3 ≡ 4 (mod 7)` because `-3 = 7(-1) + 4`. `-15 ≡ 6 (mod 7)` because `-15 = 7(-3) + 6`." },
    { t: "Power Reduction: 46¹⁰⁰ mod 5", b: "`46 ≡ 1 (mod 5)`, so `46¹⁰⁰ ≡ 1¹⁰⁰ = 1 (mod 5)`." },
    { t: "Clock & Chessboard", b: "12-hour clock at 6 pm + 76 hours: `76 ≡ 4 (mod 12)` → `10 pm`. 6×6 chessboard minus 2 opposite corners: removes 2 squares of the same colour (say 18 white, 16 black), so 17 dominoes (1 white + 1 black each) is impossible!" }
  ],
  cmds: [["a ≡ b (mod n)  ⇔  n | (a - b)", "Core congruence equivalence"], ["ka ≡ kb (mod n)  ⇏  a ≡ b (mod n)", "Cancellation requires care!"]],
  exam: [
    "Always write standard remainders in `[0, n - 1]`, especially for negative dividends (`-47 mod 5 = 3`, not `-2`).",
    "Reduce bases modulo `n` BEFORE raising to large powers, or find the cycle length of `a¹, a², a³, ... (mod n)`.",
    "Never blindly cancel a common factor `k` from `ka ≡ kb (mod n)` when `k` shares a factor with `n`."
  ],
  traps: [
    "Giving `-2` as the standard remainder of `-47 ÷ 5` (standard remainder must be `0 ≤ r < 5`, so `3`).",
    "Cancelling `2` in `2·1 ≡ 2·4 (mod 6)` to falsely claim `1 ≡ 4 (mod 6)`."
  ],

{ n: 8, part: 3, title: "Coordinate Geometry: Circles", slides: "M1_Lecture_Sheet_08.pdf · 20 pages",
  simple: "A circle is the collection of all points at one fixed positive distance `r` (radius) from one fixed point `(h, k)` (centre). Squaring the distance formula gives `(x - h)² + (y - k)² = r²`. Expanding gives the general form `x² + y² + 2gx + 2fy + c = 0`. A line can cut a circle at 2 points (`d < r`), touch as a tangent at 1 point (`d = r`, where `radius ⊥ tangent`), or miss (`d > r`).",
  analogy: "A guard robot with sensor radius `r` at `(h, k)`: any point with squared distance `S < r²` is inside, `S = r²` is on the boundary, and `S > r²` is outside.",
  concepts: [
    "**Standard Equation:** `(x - h)² + (y - k)² = r²`, centre `(h, k)`, radius `r`.",
    "**Sign Trap in Standard Form:** `(x + 4)² + (y - 3)² = 25` has centre **`(-4, 3)`**, because `x + 4 = x - (-4)`.",
    "**Point Position Test:** Compute `S = (x₀ - h)² + (y₀ - k)²`. `S < r²` → **Inside** · `S = r²` → **On the circle** · `S > r²` → **Outside**.",
    "**Diameter Endpoints `A, B`:** Centre = midpoint of `AB`; radius `r = AB / 2`.",
    "**General Equation:** `x² + y² + 2gx + 2fy + c = 0`. Centre = **`(-g, -f)`**, radius = **`√(g² + f² - c)`**. Must have equal `x², y²` coefficients and NO `xy`-term!",
    "**Degenerate Cases (`(x - h)² + (y - k)² = q`):** `q > 0` → real circle of radius `√q` · `q = 0` → single point `(h, k)` · `q < 0` → no real points.",
    "**Line–Circle Distance Test:** Let `d` = perpendicular distance from centre `(h, k)` to line `Ax + By + C = 0`: `d = |Ah + Bk + C| / √(A² + B²)`. `d < r` → cuts at 2 points (secant) · `d = r` → tangent (1 point) · `d > r` → misses (0 points).",
    "**Radius–Tangent Property:** At the point of contact `T`, **`radius ⊥ tangent`**.",
    "**Tangent to `x² + y² = r²` at `(x₁, y₁)`:** `xx₁ + yy₁ = r²`."
  ],
  terms: [
    ["Standard Circle Form", "(x - h)² + (y - k)² = r² with centre (h, k) and radius r.", 1],
    ["General Circle Form", "x² + y² + 2gx + 2fy + c = 0; centre (-g, -f), r = √(g² + f² - c).", 1],
    ["Point Position Test", "Compare S = (x₀-h)² + (y₀-k)² with r²: < inside, = on, > outside.", 1],
    ["Tangent", "A line meeting the circle at exactly 1 point (d = r); perpendicular to the radius at contact.", 1]
  ],
  examples: [
    { t: "Completing the Square: x² + y² - 6x + 4y - 12 = 0", b: "", code: "(x² - 6x + 9) + (y² + 4y + 4) = 12 + 9 + 4\n(x - 3)² + (y + 2)² = 25\nCentre = (3, -2),  Radius = 5" },
    { t: "Tangent at T(3, 4) on x² + y² = 25", b: "Check `3² + 4² = 25`. Compact formula `xx₁ + yy₁ = r²` gives `3x + 4y = 25`." }
  ],
  cmds: [["(x - h)² + (y - k)² = r²", "Standard form"], ["C = (-g, -f), r = √(g² + f² - c)", "From general form"], ["d = |Ah + Bk + C| / √(A² + B²)", "Line–circle distance test"]],
  exam: [
    "Flip signs when reading `(h, k)` from `(x - h)² + (y - k)² = r²`, and take `√` of RHS for `r`.",

{ n: 9, part: 4, title: "Sequences and Series", slides: "M1_Lecture_Sheet_09.pdf · 25 pages",
  simple: "A **sequence** is an ordered list of numbers following a rule (`a₁, a₂, ...`); a **series** adds those terms together (`S_n = a₁ + ... + a_n`). Arithmetic Progressions (AP) add a constant difference `d`; Geometric Progressions (GP) multiply by a constant ratio `r`. Sigma notation `Σ` writes sums compactly (like a `for` loop), double sums match nested loops, and telescoping sums cancel middle terms like a collapsing telescope.",
  analogy: "Gauss's trick: to add `5 + 8 + ... + 32`, pair the staircase with its mirror image reversed. Every column sums to `a + l`, so `2S_n = n(a + l)`!",
  concepts: [
    "**Sequence vs. Series:** Sequence = ordered list `a₁, a₂, ..., a_n`. Series = sum `a₁ + a₂ + ...`. `n`th partial sum `S_n = a₁ + ... + a_n`.",
    "**Arithmetic Progression (AP):** Constant difference `d`. `n`th term: **`a_n = a + (n - 1)d`**. Sum: **`S_n = n(a + l)/2 = n(2a + (n - 1)d)/2`**.",
    "**Geometric Progression (GP):** Constant non-zero ratio `r`. `n`th term: **`a_n = a r^(n-1)`**. Finite sum (`r ≠ 1`): **`S_n = a(r^n - 1)/(r - 1) = a(1 - r^n)/(1 - r)`**. If `r = 1`, `S_n = na`.",
    "**Infinite Geometric Series:** When **`|r| < 1`**, `r^n → 0` as `n → ∞`, so **`S_∞ = a / (1 - r)`**.",
    "**Sigma Notation (`Σ`) & Computational Thinking:** `Σ_{i=1}^n f(i)` mirrors a `for` loop. Closed-form formulas run in `O(1)` operations instead of `O(n)` loop steps.",
    "**Double Summation:** `Σ_{i=1}^n Σ_{j=1}^m f(i, j)` mirrors nested loops (inner sum first). Triangular sum `Σ_{i=1}^n Σ_{j=1}^i 1 = n(n + 1)/2`.",
    "**Telescoping Sums:** Rewrite terms as `f(k) - f(k + 1)` (often via partial fractions or rationalising): `Σ_{k=1}^n [f(k) - f(k + 1)] = f(1) - f(n + 1)`."
  ],
  terms: [
    ["Arithmetic Progression (AP)", "Consecutive terms differ by a constant d: a_n = a + (n-1)d.", 1],
    ["Geometric Progression (GP)", "Consecutive terms multiply by a constant r: a_n = ar^(n-1).", 1],
    ["Infinite GP Sum", "S_∞ = a / (1 - r), valid only when |r| < 1.", 1],
    ["Sigma Notation (Σ)", "Compact sum notation: Σ_{i=1}^n f(i), analogous to a for loop.", 1],
    ["Telescoping Sum", "A sum where intermediate terms cancel out, leaving only boundary terms.", 1]
  ],
  examples: [
    { t: "AP & GP Sums", b: "", code: "AP 5, 8, 11, ..., 32 (n=10): S₁₀ = 10(5 + 32)/2 = 185\nGP 100, 50, 25, ... (r=1/2): S_∞ = 100 / (1 - 1/2) = 200" },
    { t: "Telescoping with Partial Fractions", b: "`1 / (k(k + 1)) = 1/k - 1/(k + 1)`, so `Σ_{k=1}^n 1/(k(k+1)) = 1 - 1/(n+1) = n/(n+1)`." },
    { t: "Telescoping with Square Roots", b: "`1 / (√(k+1) + √k) = √(k+1) - √k`, so `Σ_{k=1}^n = √(n+1) - 1`." }
  ],
  cmds: [["a_n = a + (n-1)d,  S_n = n(a+l)/2", "AP formulas"], ["a_n = ar^(n-1),  S_n = a(r^n-1)/(r-1)", "GP formulas"], ["S_∞ = a / (1 - r)   (|r| < 1)", "Infinite GP"]],
  exam: [
    "Always check `|r| < 1` before using `S_∞ = a / (1 - r)`.",
    "For `Σ [f(k) - f(k+1)]`, write out the first 2 and last 2 terms to verify which boundary terms survive (e.g. `k(k+3)` leaves 3 terms at the start and 3 at the end!).",
    "Formula vs loop: closed-form formula computes the sum in constant steps instead of looping `n` times."
  ],
  traps: [
    "Using `n` instead of `n - 1` in `a_n = a + (n - 1)d` or `ar^(n - 1)`.",
    "Applying `S_∞ = a / (1 - r)` when `|r| ≥ 1`."
  ],
  tricks: ["AP = add `d`, GP = multiply `r`.", "Telescoping = decompose → rewrite as difference → cancel middle."],
  revise: ["AP: a+(n-1)d, n(a+l)/2.", "GP: ar^(n-1), a(r^n-1)/(r-1), S_∞=a/(1-r).", "Sigma = loop, Double Sigma = nested loop.", "Telescoping cancellation."],

{ n: 10, part: 4, title: "Counting–1: Principles, Permutations & Combinations", slides: "M1_Lecture_Sheet_10.pdf · 15 pages",
  simple: "Counting without listing relies on two pillars: **Multiplication Principle** for successive stages (**AND** → multiply) and **Addition Principle** for separate non-overlapping cases (**OR** → add). Next, ask: *does order matter?* If yes, use **Permutations (`nPr`)**; if no, divide out internal arrangements `r!` to get **Combinations (`nCr`)**. For repeated letters, divide by `n₁! n₂! ...`, and for 'at least one', subtract unwanted cases from all cases.",
  analogy: "Choosing an outfit = shirt AND trousers AND shoes (multiply). Picking a route = bus OR train (add). A committee `{A, B} = {B, A}` (combination), while President & Secretary is ordered (permutation).",
  concepts: [
    "**Multiplication Principle (AND):** Successive stages with `n₁, n₂, ..., n_k` choices → `n₁ · n₂ · ... · n_k`. Always check if repetition is allowed!",
    "**Addition Principle (OR):** Non-overlapping cases → `Case 1 + Case 2 + ...`.",
    "**Factorial:** `n! = n(n - 1)(n - 2)···2·1` (distinct arrangements of `n` objects).",
    "**Permutations (`nPr`):** Order **matters**: `nPr = n! / (n - r)!`.",
    "**Combinations (`nCr`):** Order **does not matter**: `nCr = nPr / r! = n! / (r!(n - r)!)`.",
    "**Arrangements with Repeated Objects:** For `n` objects with identical groups of sizes `n₁, n₂, ..., n_k`, distinct arrangements = `n! / (n₁! n₂! ··· n_k!)` (e.g. `LEVEL`: `5! / (2!2!) = 30`).",
    "**Complementary Counting:** `Desired = All - Undesired`. Ideal for **'at least one'** (e.g. at least 1 red ball = Total selections - All blue selections).",
    "**Restrictions & Blocks:** Handle restrictions **first** (e.g. even last digit). When objects must sit together, glue them into one block AND remember to multiply by the internal arrangements of the block!"
  ],
  terms: [
    ["Multiplication Principle", "Multiply choices across successive stages (AND).", 1],
    ["Addition Principle", "Add counts across separate non-overlapping cases (OR).", 1],
    ["Permutation (nPr)", "Ordered selection/arrangement of r from n: n! / (n-r)!.", 1],
    ["Combination (nCr)", "Unordered selection of r from n: n! / (r!(n-r)!).", 1],
    ["Complementary Counting", "All outcomes minus undesired outcomes.", 1]
  ],
  examples: [
    { t: "LEVEL & BANANA", b: "`LEVEL` (5 letters, 2 L's, 2 E's): `5!/(2!2!) = 30`. `BANANA` (6 letters, 3 A's, 2 N's): `6!/(3!2!) = 60`." },
    { t: "At Least One Red Ball", b: "4 red, 6 blue; pick 3: `C(10,3) - C(6,3) = 120 - 20 = 100`." },
    { t: "Two Friends Together", b: "5 friends in a row with A & B together: treat `[AB]` as 1 block → `4!` arrangements of 4 items × `2!` internal arrangements = `24 × 2 = 48`." }
  ],
  cmds: [["nPr = n! / (n-r)!", "Order matters"], ["nCr = n! / (r!(n-r)!)", "Order does NOT matter"], ["n! / (n₁! n₂! ··· n_k!)", "Repeated objects"]],
  exam: [
    "Always ask: (1) Repetition allowed? (2) Does order matter?",
    "Handle restricted positions (e.g. last digit even) BEFORE filling other positions.",
    "When gluing items into a block, never forget to multiply by the internal arrangements inside the block."
  ],
  traps: [
    "Using `nPr` for a committee or team selection where roles are identical (should be `nCr`).",
    "Forgetting to multiply by `2!` (or `k!`) for arrangements *inside* a glued block."
  ],
  tricks: ["AND = ×, OR = +.", "Order matters → Permutation; Order doesn't → Combination.", "'At least one' → Total − None."],
  revise: ["AND (×) vs OR (+).", "nPr vs nCr.", "Repeated objects: divide by n₁!n₂!...", "Complementary counting & block method."],
  np: [],
  link: { to: "#/countlab", label: "Open Sequences & Counting Lab" } },

{ n: 11, part: 4, title: "Counting–2: Inclusion–Exclusion, Pigeonhole & Stars and Bars", slides: "M1_Lecture_Sheet_11.pdf · 14 pages",
  simple: "When direct counting is hard, look for hidden structure: **Inclusion–Exclusion** fixes double-counting of overlapping sets; the **Pigeonhole Principle** proves something *must* happen when objects outnumber boxes; **Recurrence Relations** build large counts from smaller ones; **Double Counting** counts the same thing two ways; and **Stars and Bars** counts ways to distribute identical objects into distinct boxes.",
  analogy: "Stars & Bars: 5 identical chocolates (`⋆`) shared among 3 students need 2 dividers (`|`), like `⋆⋆|⋆|⋆⋆`. Choosing where to put the 2 bars among `5 + 2 = 7` slots gives `C(7, 2) = 21`!",
  concepts: [
    "**Inclusion–Exclusion (2 sets):** `|A ∪ B| = |A| + |B| - |A ∩ B|` (subtract the overlap counted twice).",
    "**Inclusion–Exclusion (3 sets):** `|A ∪ B ∪ C| = |A| + |B| + |C| - |A ∩ B| - |A ∩ C| - |B ∩ C| + |A ∩ B ∩ C|` (ensure every element is counted once).",
    "**Pigeonhole Principle:** If `n + 1` (or more) objects are placed into `n` boxes, at least one box contains at least `2` objects. (Generalised: `N` objects in `k` boxes → at least `⌈N/k⌉` in one box.)",
    "**Recurrence Relations:** Define `a_n` using smaller terms, e.g. staircase (`1` or `2` steps) or `1×n` domino tiling: `a_n = a_(n-1) + a_(n-2)` with initial values `a₁ = 1, a₂ = 2`. *Incomplete without initial values!*",
    "**Double Counting:** Count the same set in two ways, e.g. handshakes among `n` people: `C(n, 2) = n(n - 1)/2`.",
    "**Stars and Bars (non-negative):** Number of integer solutions `x₁ + x₂ + ... + x_k = n` (`x_i ≥ 0`) is **`C(n + k - 1, k - 1)`** (`n` stars, `k - 1` bars).",
    "**Stars and Bars (at least 1 each):** Give 1 to each of the `k` recipients first, leaving `n - k` stars → **`C(n - 1, k - 1)`**."
  ],
  terms: [
    ["Inclusion–Exclusion", "Alternating add/subtract of intersections so every element is counted once.", 1],
    ["Pigeonhole Principle", "n+1 objects in n boxes ⇒ at least one box has ≥ 2 objects.", 1],
    ["Recurrence Relation", "A rule expressing a_n in terms of earlier terms, plus initial values.", 1],
    ["Stars and Bars", "C(n+k-1, k-1) non-negative integer solutions to x₁ + ... + x_k = n.", 1]
  ],
  examples: [
    { t: "Multiples of 2 or 3 from 1 to 60", b: "`|A| = 30`, `|B| = 20`, `|A ∩ B| = 10` (multiples of 6) → `30 + 20 - 10 = 40`." },
    { t: "Stars & Bars: 8 sweets, 3 children (≥ 1 each)", b: "Give 1 sweet to each child first → `8 - 3 = 5` sweets left for 3 children → `C(5 + 3 - 1, 3 - 1) = C(7, 2) = 21`." }
  ],
  cmds: [["|A ∪ B| = |A| + |B| - |A ∩ B|", "2-set Inclusion–Exclusion"], ["n + 1 objects → n boxes ⇒ ≥ 2 in one box", "Pigeonhole Principle"], ["C(n + k - 1, k - 1)", "Stars & Bars (x_i ≥ 0)"]],
  exam: [
    "Always state both the **pigeons** and the **holes** clearly in Pigeonhole proofs.",
    "Never write a recurrence relation without its **initial values** (`a₁, a₂`).",
    "In Stars & Bars, check whether boxes can be empty (`x_i ≥ 0`) or must have `≥ 1` (pre-assign 1 to each first!)."
  ],
  traps: [
    "Using `C(n + k, k)` instead of `C(n + k - 1, k - 1)` in Stars & Bars (there are `k - 1` bars, not `k`!).",
    "Forgetting to add back `|A ∩ B ∩ C|` in 3-set Inclusion–Exclusion."
  ],
  tricks: ["`k` recipients need `k - 1` bars.", "At least `m` each? Hand out `m` to each first, then Stars & Bars!"],
  revise: ["Inclusion–Exclusion (2 & 3 sets).", "Pigeonhole & Generalised Pigeonhole.", "Recurrence + initial values.", "Double counting.", "Stars & Bars: C(n+k-1, k-1)."],
  np: [],
  link: { to: "#/countlab", label: "Open Sequences & Counting Lab" } }

/* ================= SOUND ================= */
let AC = null;
function audioCtx() {
  if (!S.sound) return null;
  try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); return AC; } catch (e) { return null; }
}
function playTone(freqs, dur, type, vol) {
  const ctx = audioCtx(); if (!ctx) return;
  try {
    freqs.forEach((f, i) => {
      const t0 = ctx.currentTime + i * (dur * 0.9);
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type = type || "triangle"; osc.frequency.value = f;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime((vol || 0.25), t0 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    });
  } catch (e) {}
}
function toggleSound() { S.sound = !S.sound; saveState(); if (S.sound) playTone([523], 0.08); rerender(); }

  gameStart: () => { gameNew(8); rerender(); },

  gameFlip: (idx) => {
    idx = +idx;
    if (!GAME || GAME.lock || GAME.won) return;
    const card = GAME.cards[idx];
    if (!card || card.flipped || card.matched) return;

    if (GAME.firstPick == null) { GAME.firstPick = idx; rerender(); return; }

      if (GAME.matchedPairs === GAME.totalPairs) {
        GAME.won = true;
        const elapsed = Math.round((Date.now() - GAME.startedAt) / 1000);

        if (!S.gameBest || GAME.moves < S.gameBest.moves) S.gameBest = { moves: GAME.moves, seconds: elapsed };

/* ============ 1. QUADRATIC & INEQUALITY SOLVER ============ */
let QSOL = { a: 1, b: -7, c: 10, op: ">" };
Object.assign(ACTIONS, { qsolOp: (op) => { QSOL.op = op; rerender(); } });
function qsolRender() {
  const { a, b, c, op } = QSOL;
  if (a === 0) return '<p class="err">Coefficient a cannot be 0 for a quadratic equation.</p>';
  const D = b * b - 4 * a * c;
  const vx = -b / (2 * a), vy = a * vx * vx + b * vx + c;
  let rootsTxt = "", nature = "", intervalTxt = "";
  if (D > 0) {
    const r1 = (-b - Math.sqrt(D)) / (2 * a);
    const r2 = (-b + Math.sqrt(D)) / (2 * a);
    const lo = Math.min(r1, r2), hi = Math.max(r1, r2);
    nature = "Two distinct real roots (D > 0)";
    rootsTxt = "x₁ = " + lo.toFixed(4).replace(/\.?0+$/, "") + ",  x₂ = " + hi.toFixed(4).replace(/\.?0+$/, "");
    const wantPos = (op === ">" || op === "≥");
    const inc = (op === "≥" || op === "≤");
    const lb = inc ? "[" : "(", rb = inc ? "]" : ")";
    const outside = (a > 0 && wantPos) || (a < 0 && !wantPos);
    intervalTxt = outside
      ? "(-∞, " + lo.toFixed(3).replace(/\.?0+$/, "") + rb + " ∪ " + lb + hi.toFixed(3).replace(/\.?0+$/, "") + ", ∞)"
      : lb + lo.toFixed(3).replace(/\.?0+$/, "") + ", " + hi.toFixed(3).replace(/\.?0+$/, "") + rb;
  } else if (D === 0) {
    const r0 = -b / (2 * a);
    nature = "One repeated real root (D = 0)";
    rootsTxt = "x = " + r0.toFixed(4).replace(/\.?0+$/, "");
    const rStr = r0.toFixed(3).replace(/\.?0+$/, "");
    if (a > 0) {

let MLAB = { a: 252, b: 198, n: -47, m: 5, base: 7, exp: 777, modp: 10 };
function modPow(base, exp, m) {
  if (m <= 0) return 0;
  let res = 1, b = ((base % m) + m) % m, e = Math.max(0, Math.floor(exp));
  while (e > 0) { if (e % 2 === 1) res = (res * b) % m; b = (b * b) % m; e = Math.floor(e / 2); }
  return res;
}
function mlabRender() {

  const negRep = stdRem === 0 ? 0 : stdRem - modN;

  const powRes = modPow(Math.floor(MLAB.base), Math.floor(MLAB.exp), pMod);

    '<div class="stat"><b>' + lcm + '</b><span>lcm(' + x + ', ' + y + ')</span></div>' +

    '</div>' +
    '<div class="card flat" style="margin-top:12px"><b>Euclidean Algorithm Steps</b>' + codeBlock(steps.join("\n") + "\n# Last non-zero remainder = " + gcd) + '</div>' +
    '<div class="card flat"><b>Modular Remainder &amp; Power</b>' +
    '<div class="kv" style="margin-top:8px">' +
    '<dt>Division Form</dt><dd><code>' + Math.floor(MLAB.n) + ' = ' + modN + '(' + qDiv + ') + ' + stdRem + '</code></dd>' +
    '<dt>Standard Remainder</dt><dd><code>' + stdRem + '</code> (in [0, ' + (modN - 1) + ']) · Negative representative: <code>' + negRep + '</code></dd>' +
    '<dt>Modular Power</dt><dd><code>' + Math.floor(MLAB.base) + '^' + Math.floor(MLAB.exp) + ' ≡ ' + powRes + ' (mod ' + pMod + ')</code></dd>' +

let SLAB = { a: 5, d: 3, r: 2, n: 10, cn: 8, cr: 3, sbN: 5, sbK: 3 };
function fact(n) { let res = 1; for (let i = 2; i <= n; i++) res *= i; return res; }
function nCr(n, r) { if (r < 0 || r > n) return 0; r = Math.min(r, n - r); let res = 1; for (let i = 0; i < r; i++) res = res * (n - i) / (i + 1); return Math.round(res); }

  const gpNth = SLAB.a * Math.pow(SLAB.r, n - 1);
  const gpSum = SLAB.r === 1 ? SLAB.a * n : SLAB.a * (Math.pow(SLAB.r, n) - 1) / (SLAB.r - 1);
  const gpInf = Math.abs(SLAB.r) < 1 ? (SLAB.a / (1 - SLAB.r)).toFixed(4).replace(/\.?0+$/, "") : "Diverges (|r| ≥ 1)";
  const cn = Math.max(0, Math.min(20, Math.floor(SLAB.cn))), cr = Math.max(0, Math.min(cn, Math.floor(SLAB.cr)));
  const comb = nCr(cn, cr), perm = comb * fact(cr);
  const sb = nCr(Math.max(0, Math.floor(SLAB.sbN)) + Math.max(1, Math.floor(SLAB.sbK)) - 1, Math.max(1, Math.floor(SLAB.sbK)) - 1);

function quizTrendStats() {
  const dayKey = date => date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0") + "-" + String(date.getDate()).padStart(2, "0");
  const days = [];
  const today = new Date();
  for (let i = 6; i >= 0; i--) {
    const date = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
    days.push({ key: dayKey(date), label: date.toLocaleDateString(undefined, { weekday: "short" }), total: 0, correct: 0, accuracy: 0 });
  }
  const byDay = {};
  days.forEach(day => { byDay[day.key] = day; });
  Object.entries(S.quiz).forEach(([key, correct]) => {
    const match = key.match(/-(\d{13})$/);
    if (!match) return;
    const date = new Date(Number(match[1]));
    if (isNaN(date.getTime())) return;
    const day = byDay[dayKey(date)];
    if (!day) return;
    day.total++;
    if (correct) day.correct++;
  });
  days.forEach(day => { day.accuracy = day.total ? Math.round((day.correct / day.total) * 100) : 0; });

}

    const unfinishedBonus = S.done[module.n] ? 0 : 15;
    const dailyGoalBonus = daily.completed < daily.goal && !S.done[module.n] ? 10 : 0;
    const score = Math.min(100, weaknessPoints + unfinishedBonus + dailyGoalBonus);
    return { module, topics, score };
  }).sort((a, b) => b.score - a.score || b.topics.length - a.topics.length || a.module.n - b.module.n);
  const best = ranked[0];
  if (best && best.score > 0) {
    if (best.topics.length) {
      const lowestAccuracy = Math.min(...best.topics.map(w => w.accuracy));
      return {
        title: "Priority: revise Sheet " + best.module.n,
        message: best.topics.length + " weak question" + (best.topics.length === 1 ? "" : "s") + " found here. Lowest recorded accuracy: " + lowestAccuracy + "%. Review this sheet first.",
        button: "Review Sheet " + best.module.n + " →", href: "#/module/" + best.module.n, score: best.score
      };
    }
    return {
      title: "Recommended: continue learning",
      message: "Lecture Sheet " + best.module.n + " — " + best.module.title + " is your next unfinished sheet.",
      button: "Continue learning →", href: "#/module/" + best.module.n, score: best.score
    };
  }
  return { title: "Course complete — keep revising", message: "All sheets are complete and no weak questions are recorded. Try a mixed quiz.", button: "Start a mixed quiz →", href: "#/quiz", score: 10 };
}

/* ============ QUIZ & EXAM ENGINE ============ */
function qOptions(q) {
  if (q.t === "mcq" || (q.t === "cpu" && q.o)) {
    return shuffle(q.o.map((text, i) => ({ key: String.fromCharCode(97 + i), text, correct: i === 0 })));
  }
  return null;
}
function qLabel(q) { return { mcq: "Multiple Choice", tf: "True / False", fill: "Fill in the Blank", cpu: "Numeric Calculation" }[q.t] || "Question"; }
function qPrompt(q) {
  let html = '<div class="row" style="gap:8px;margin-bottom:6px"><span class="badge p' + partOf(q.m) + '">Sheet ' + q.m + '</span><span class="badge ' + (q.d === "e" ? "ok" : q.d === "m" ? "warn" : "bad") + '">' + ({ e: "Easy", m: "Medium", h: "Hard" }[q.d]) + '</span><span class="badge">' + qLabel(q) + "</span></div>";
  html += '<div class="q-text">' + md(q.q) + "</div>";
  return html;
}
function qRenderInput(q, attempt, name) {
  if (q.t === "tf") {
    return '<div class="row" style="gap:10px">' + [["true", "True"], ["false", "False"]].map(([v, l]) =>
      '<button class="opt" style="width:auto" data-act="qPick" data-arg="' + name + '|' + v + '"><span class="k">' + l[0] + "</span>" + l + "</button>").join("") + "</div>";
  }
  if (q.t === "fill") {
    return '<div class="row"><input type="text" id="fillInput-' + name + '" placeholder="Type your answer" style="max-width:320px" aria-label="Your answer"><button class="btn pri" data-act="qSubmitFill" data-arg="' + name + '">Submit</button></div>';
  }
  if (q.t === "cpu" && !q.o) {
    return '<div class="row"><input type="number" step="any" id="numInput-' + name + '" placeholder="Numeric answer" style="max-width:220px" aria-label="Your numeric answer"><button class="btn pri" data-act="qSubmitNum" data-arg="' + name + '">Submit</button></div>';
  }
  return attempt.shuffled.map(o => '<button class="opt" data-act="qPick" data-arg="' + name + '|' + o.key + '"><span class="k">' + o.key.toUpperCase() + "</span>" + md(o.text) + "</button>").join("");
}
function qRenderAnswered(q, attempt, name) {
  let body = "";
  if (q.t === "tf") {
    body = '<div class="row" style="gap:10px">' + [["true", "True"], ["false", "False"]].map(([v, l]) => {
      const cls = v === String(q.a) ? "right" : (attempt.given === v ? "wrong" : "");
      return '<button class="opt ' + cls + '" style="width:auto" disabled><span class="k">' + l[0] + "</span>" + l + "</button>";
    }).join("") + "</div>";
  } else if (q.t === "fill") {
    body = '<div class="opt ' + (attempt.correct ? "right" : "wrong") + '" style="cursor:default">Your answer: ' + esc(attempt.given || "(blank)") + "</div>" +
      (attempt.correct ? "" : '<div class="opt right" style="cursor:default">Accepted: ' + q.acc.map(esc).join(" / ") + "</div>");
  } else if (q.t === "cpu" && !q.o) {
    body = '<div class="opt ' + (attempt.correct ? "right" : "wrong") + '" style="cursor:default">Your answer: ' + esc(attempt.given) + "</div>" +
      (attempt.correct ? "" : '<div class="opt right" style="cursor:default">Correct answer: ' + q.n + "</div>");
  } else {
    body = attempt.shuffled.map(o => '<button class="opt ' + (o.correct ? "right" : (attempt.given === o.key ? "wrong" : "")) + '" disabled><span class="k">' + o.key.toUpperCase() + "</span>" + md(o.text) + "</button>").join("");
  }
  return body + '<div class="fb ' + (attempt.correct ? "ok" : "bad") + '"><b>' + (attempt.correct ? "Correct!" : "Not quite.") + "</b> " + md(q.x) + '<div class="small muted" style="margin-top:6px">From <a href="#/module/' + q.m + '">Sheet ' + q.m + " · " + esc(modTitle(q.m)) + "</a></div></div>";
}
function checkFill(q, given) { const g = normText(given); return q.acc.some(a => normText(a) === g); }
function checkNum(q, given) { const v = parseFloat(given); return !isNaN(v) && Math.abs(v - q.n) <= Math.max(0.02, Math.abs(q.n) * 0.01); }

let QZ = { pool: [], i: 0, attempts: {}, shuffles: {}, part: "All", diff: "All", started: false, targeted: false };
function qzGetShuffle(name, q) { if (!QZ.shuffles[name]) QZ.shuffles[name] = qOptions(q); return QZ.shuffles[name]; }
function qzBuildPool() {

    ? QUESTIONS.filter(q => new Set(weakQuestions().map(w => w.id)).has(q.id))
    : QUESTIONS.filter(q => (QZ.part === "All" || partOf(q.m) === +QZ.part) && (QZ.diff === "All" || q.d === QZ.diff));

  qzRestart: () => { QZ.started = false; QZ.targeted = false; rerender(); },

Object.assign(ACTIONS, {

  qSubmitFill: (name) => { const i = +name.split("-")[1]; if (name.startsWith("qz-")) qzSubmitFill(i); else exSubmitFill(i); },

let EX = { pool: [], i: 0, attempts: {}, shuffles: {}, started: false, finished: false };
function exGetShuffle(name, q) { if (!EX.shuffles[name]) EX.shuffles[name] = qOptions(q); return EX.shuffles[name]; }
function exBuildPool() {

Object.assign(ACTIONS, {

  exNext: () => { EX.i = Math.min(EX.pool.length - 1, EX.i + 1); rerender(); },

  if (!skipScroll) window.scrollTo({ top: 0 });
  closeSidebar();
  setTimeout(() => { enableCardTilt(); enableScrollReveal(); enableMagneticButtons(); enableButtonRipple(); enableCardSpotlight(); }, 50);
}

function bindTopbar() {
  const menuBtn = $("#menuBtn"); if (menuBtn) menuBtn.addEventListener("click", openSidebar);
  const themeBtn = $("#themeBtn");
  if (themeBtn) themeBtn.addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const curDark = cur !== "light";
    applyTheme(curDark ? "light" : "dark");
    $("#themeBtn").innerHTML = curDark ? ICONS.moon : ICONS.sun;
  });
  const topSearch = $("#topSearch");
  if (topSearch) topSearch.addEventListener("keydown", (e) => { if (e.key === "Enter" && topSearch.value.trim()) location.hash = "#/search/" + encodeURIComponent(topSearch.value.trim()); });
}
function openSidebar() { $(".sidebar").classList.add("open"); $("#overlay").classList.add("show"); }
function closeSidebar() { const sb = $(".sidebar"); if (sb) sb.classList.remove("open"); const ov = $("#overlay"); if (ov) ov.classList.remove("show"); }

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (el) { const fn = ACTIONS[el.dataset.act]; if (fn) { e.preventDefault(); fn(el.dataset.arg); } return; }
  if (e.target.id === "overlay") closeSidebar();
});
document.addEventListener("keydown", (e) => {
  const typing = document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (e.key === "Enter" || e.key === " ") {
    const el = e.target.closest && e.target.closest('[role="button"][data-act]');
    if (el && document.activeElement === el) { e.preventDefault(); const fn = ACTIONS[el.dataset.act]; if (fn) fn(el.dataset.arg); }
  }
  if (e.key === "Escape") closeSidebar();
  if (typing) {
    if (e.key === "Enter") {
      const fillBtn = $('[data-act="qSubmitFill"]'); const numBtn = $('[data-act="qSubmitNum"]');
      if (document.activeElement.id.startsWith("fillInput") && fillBtn) { e.preventDefault(); fillBtn.click(); }
      else if (document.activeElement.id.startsWith("numInput") && numBtn) { e.preventDefault(); numBtn.click(); }
    }
    return;
  }
  const { parts } = parseHash();
  if ((parts[0] === "quiz" || parts[0] === "exam") && /^[1-4]$/.test(e.key)) {
    const btn = $$('.opt[data-act="qPick"]:not([disabled])')[+e.key - 1];
    if (btn) { e.preventDefault(); btn.click(); }
  }
  if (parts[0] === "flashcards") {
    if (e.key === "ArrowRight") { e.preventDefault(); const b = $('[data-act="fcNext"]'); if (b) b.click(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); const b = $('[data-act="fcPrev"]'); if (b) b.click(); }
    else if (e.key === " " || e.key === "Enter") { e.preventDefault(); const b = $('[data-act="fcFlip"]'); if (b) b.click(); }
    else if (e.key === "1") { e.preventDefault(); const b = $('[data-act="fcKnow"][data-arg="0"]'); if (b) b.click(); }
    else if (e.key === "2") { e.preventDefault(); const b = $('[data-act="fcKnow"][data-arg="1"]'); if (b) b.click(); }
  }
});

window.addEventListener("hashchange", () => route(false));
window.addEventListener("DOMContentLoaded", () => { initTheme(); route(false); createParticles(); });

/* ===== VISUAL EFFECTS ===== */
document.addEventListener("mousemove", (e) => {
  document.body.style.setProperty("--mouse-x", `${e.clientX}px`);
  document.body.style.setProperty("--mouse-y", `${e.clientY}px`);
});
function enableCardTilt() {
  document.querySelectorAll(".card, .tile, .stat").forEach((card) => {
    if (card.dataset.tiltEnabled) return;
    card.dataset.tiltEnabled = "true";
    card.addEventListener("mousemove", (e) => {
      const rect = card.getBoundingClientRect();
      const rotateX = (((e.clientY - rect.top) - rect.height / 2) / (rect.height / 2)) * -5;
      const rotateY = (((e.clientX - rect.left) - rect.width / 2) / (rect.width / 2)) * 5;
      card.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
    });
    card.addEventListener("mouseleave", () => { card.style.transform = "perspective(800px) rotateX(0deg) rotateY(0deg) scale(1)"; });
  });
}
function createParticles() {
  for (let i = 0; i < 18; i++) {
    const p = document.createElement("div"); p.className = "particle";
    p.style.left = `${Math.random() * 100}vw`; p.style.top = `${Math.random() * 100}vh`;
    p.style.animationDuration = `${8 + Math.random() * 12}s`; p.style.animationDelay = `${Math.random() * 8}s`;
    document.body.appendChild(p);
  }
}
function enableScrollReveal() {
  document.querySelectorAll(".card, .tile, .stat").forEach((el) => {
    if (el.dataset.revealEnabled) return;
    el.dataset.revealEnabled = "true"; el.classList.add("reveal");
  });
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => { if (entry.isIntersecting) { entry.target.classList.add("visible"); observer.unobserve(entry.target); } });
  }, { threshold: 0.08 });
  document.querySelectorAll(".reveal").forEach((el) => observer.observe(el));
}
function enableMagneticButtons() {
  document.querySelectorAll(".btn").forEach((button) => {
    if (button.dataset.magneticEnabled) return;
    button.dataset.magneticEnabled = "true";
    button.addEventListener("mousemove", (e) => {
      const rect = button.getBoundingClientRect();
      button.style.transform = `translate(${((e.clientX - rect.left) - rect.width / 2) * 0.15}px, ${((e.clientY - rect.top) - rect.height / 2) * 0.15}px)`;
    });
    button.addEventListener("mouseleave", () => { button.style.transform = "translate(0, 0)"; });
  });
}
function enableButtonRipple() {
  document.querySelectorAll(".btn").forEach((button) => {
    if (button.dataset.rippleEnabled) return;
    button.dataset.rippleEnabled = "true"; button.classList.add("ripple-btn");
    button.addEventListener("click", (e) => {
      const rect = button.getBoundingClientRect(), ripple = document.createElement("span");
      ripple.className = "ripple"; ripple.style.left = `${e.clientX - rect.left}px`; ripple.style.top = `${e.clientY - rect.top}px`;
      button.appendChild(ripple); setTimeout(() => ripple.remove(), 600);
    });
  });
}
function enableCardSpotlight() {
  document.querySelectorAll(".card, .tile, .stat").forEach((card) => {
    if (card.dataset.spotlightEnabled) return;
    card.dataset.spotlightEnabled = "true";
    card.addEventListener("mousemove", (e) => {
      const rect = card.getBoundingClientRect();
      card.style.setProperty("--card-x", `${e.clientX - rect.left}px`);
      card.style.setProperty("--card-y", `${e.clientY - rect.top}px`);
    });
  });
}
</script>
